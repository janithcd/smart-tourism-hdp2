name: Android build

on:
  push:
  pull_request:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked files for credentials
        run: python3 scripts/check_tracked_secrets.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Firebase emulator test dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Firestore access rules
        run: npm run test:rules:emulator
