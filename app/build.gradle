plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream -> localProperties.load(stream) }
}
def mapsApiKey = localProperties.getProperty('MAPS_API_KEY', System.getenv('MAPS_API_KEY') ?: '')
def stripeSandboxUrl = localProperties.getProperty('STRIPE_SANDBOX_URL', '').trim()
if (stripeSandboxUrl && !stripeSandboxUrl.matches('https://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[-A-Za-z0-9_/]*)?')
        && stripeSandboxUrl != 'http://localhost:4242') {
    throw new GradleException('STRIPE_SANDBOX_URL must be HTTPS or http://localhost:4242 for adb reverse.')
}

android {
    namespace 'lk.janith.smart_tourism'
    compileSdk 36

    defaultConfig {
        applicationId "lk.janith.smart_tourism"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
        manifestPlaceholders = [MAPS_API_KEY: mapsApiKey]

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'STRIPE_SANDBOX_URL', groovy.json.JsonOutput.toJson(stripeSandboxUrl)
        }
        release {
            buildConfigField 'String', 'STRIPE_SANDBOX_URL', '""'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.picasso
    implementation libs.glide

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    compileOnly("org.projectlombok:lombok:1.18.44")
    annotationProcessor("org.projectlombok:lombok:1.18.44")


    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics

    implementation(libs.firebase.auth)

    implementation(libs.firebase.firestore)


    implementation "com.google.android.gms:play-services-maps:20.0.0"
    implementation "com.google.android.gms:play-services-location:21.4.0"
    implementation "com.google.android.libraries.places:places:5.1.1"
    implementation "com.google.maps.android:android-maps-utils:4.0.0"


    implementation "androidx.appcompat:appcompat:1.7.0"
}
